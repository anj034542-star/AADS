<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Office Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="sidebar">
  <h2>Office Panel</h2>
  <a href="#" onclick="showAll()">🏠 Dashboard</a>
  <a href="#" onclick="filterDocs('pending')">📄 Pending</a>
  <a href="/logout">🚪 Logout</a>
</div>

<div class="main">

  <div class="header">
    <h1>Document Dashboard</h1>
    <button class="btn" onclick="openUploadPage()">+ Upload</button>
  </div>

  <div style="margin-top:20px;">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="🔍 Search by Tracking ID..." 
      onkeyup="searchDocs()"
    >
  </div>

  <!-- DOCUMENT LIST -->
  <div id="documentsList"></div>

</div>

<script src="dashboard.js"></script>

<script>
function openUploadPage() {
  window.location.href = "upload.html";
}
</script>

</body>
</html>
