<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resident Dashboard</title>
<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  display: flex;
  background: #eef2f7;
}

.sidebar {
  width: 250px;
  height: 100vh;
  background: #1e293b;
  color: white;
  padding: 20px;
}

.sidebar h2 {
  text-align: center;
  margin-bottom: 40px;
}

.sidebar a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  margin-bottom: 10px;
  color: #cbd5e1;
  text-decoration: none;
  border-radius: 8px;
}

.sidebar a:hover {
  background: #334155;
  color: white;
}

.main {
  flex: 1;
  padding: 30px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.btn {
  background: #2563eb;
  color: white;
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.form-card {
  background: white;
  padding: 20px;
  margin-top: 20px;
  border-radius: 12px;
  display: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

input, textarea, select {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.card {
  background: white;
  padding: 15px;
  margin-top: 15px;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 3px 8px rgba(0,0,0,0.05);
}

.card-left {
  max-width: 70%;
}

.status {
  font-weight: bold;
}

.pending { color: #f59e0b; }
.approved { color: #22c55e; }
.declined { color: #ef4444; }

.actions a {
  text-decoration: none;
  font-size: 18px;
  margin-left: 10px;
}
</style>
</head>
<body>

<div class="sidebar">
  <h2>Resident Panel</h2>
  <a href="#" onclick="showAll()">🏠 My Documents</a>
  <a href="/logout">🚪 Logout</a>
</div>

<div class="main">
  <div class="header">
    <h1>Your Document Status</h1>
    <button class="btn" onclick="toggleForm()">+ Upload New</button>
  </div>

  <div style="margin-top:20px;">
    <input type="text" id="searchInput" placeholder="🔍 Search by Tracking ID..." onkeyup="searchDocs()" style="width: 300px; padding:10px; border-radius:8px; border:1px solid #ccc;">
  </div>

  <!-- Upload Form -->
  <div class="form-card" id="docForm">
    <input type="text" id="docTitle" placeholder="Title">
    <textarea id="docDesc" placeholder="Description"></textarea>
    <select id="docOffice" style="display:none;">
  <option value="Office 1" selected>Office 1</option>
</select>
<p style="color:gray;">Documents are always first sent to Office 1 (Barangay).</p>
    </select>
    <input type="file" id="docFile" accept=".doc,.docx,.xls,.xlsx">
    <button class="btn" onclick="saveDocument()">Upload</button>
  </div>

  <!-- Document List -->
  <div id="documentsList"></div>
</div>

<script>
let allDocs = [];

function toggleForm() {
  const form = document.getElementById('docForm');
  form.style.display = form.style.display === 'block' ? 'none' : 'block';
}

function saveDocument() {
  const title = document.getElementById('docTitle').value.trim();
  const desc = document.getElementById('docDesc').value.trim();
  const office = document.getElementById('docOffice').value;
  const fileInput = document.getElementById('docFile');

  if (!title || !desc || !office || !fileInput.files.length) {
    alert("All fields required!");
    return;
  }

  const file = fileInput.files[0];
  const allowed = ['doc','docx','xls','xlsx'];
  const ext = file.name.split('.').pop().toLowerCase();

  if (!allowed.includes(ext)) {
    alert("Only Word/Excel allowed!");
    return;
  }

  const formData = new FormData();
  formData.append("title", title);
  formData.append("desc", desc);
  formData.append("office", office);
  formData.append("file", file);

  fetch('/upload', {
    method: 'POST',
    body: formData
  })
  .then(res => res.json())
  .then(data => {
    if (data.error) {
      alert(data.error);
      return;
    }
    allDocs.push(data);
    renderDocs(allDocs);
    document.getElementById('docTitle').value = '';
    document.getElementById('docDesc').value = '';
    document.getElementById('docOffice').value = '';
    fileInput.value = '';
    document.getElementById('docForm').style.display = 'none';
  })
  .catch(err => {
    alert("Upload failed!");
    console.error(err);
  });
}

function renderDocs(docs) {
  const list = document.getElementById('documentsList');
  list.innerHTML = '';

  docs.forEach(doc => {
    let statusClass = "pending";
    let statusText = doc.status || "PENDING";
    let forwardButton = "";

    // Determine if forward button should appear
    if (doc.status === "APPROVED BY BARANGAY") {
      forwardButton = `<button class="btn" style="background:#3b82f6;" onclick="forwardDocument('${doc.tracking_id}', 'mayor')">➡️ Forward to Mayor</button>`;
    } else if (doc.status === "APPROVED BY MAYOR") {
      forwardButton = `<button class="btn" style="background:#3b82f6;" onclick="forwardDocument('${doc.tracking_id}', 'governor')">➡️ Forward to Governor</button>`;
    }

    // Decline message display
    let declineHtml = "";
    if (doc.status && doc.status.includes("DECLINED")) {
      declineHtml = `<div style="background:#fee2e2; padding:8px; margin-top:8px; border-radius:6px;">
        <strong>📢 ${doc.declined_by || "An office"} declined:</strong><br>${doc.decline_reason || "No reason given"}
      </div>`;
    }

    const div = document.createElement('div');
    div.className = "card";
    div.innerHTML = `
      <div class="card-left">
        <strong>${doc.title}</strong><br>
        <small><b>ID:</b> ${doc.tracking_id}</small>
        <p>${doc.desc}</p>
        <small><b>Current office:</b> ${doc.target_office || doc.office}</small><br>
        <span class="status ${statusClass}">${statusText}</span>
        ${declineHtml}
      </div>
      <div class="actions">
        <a href="/uploads/${doc.filename}" target="_blank">📂 Open File</a>
        ${forwardButton}
      </div>
    `;
    list.appendChild(div);
  });
}

function forwardDocument(trackingId, target) {
  let url = "";
  if (target === "mayor") url = `/forward_to_mayor/${trackingId}`;
  else if (target === "governor") url = `/forward_to_governor/${trackingId}`;
  
  fetch(url, { method: 'POST' })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        alert("Document forwarded to next office!");
        loadDocs(); // refresh list
      } else {
        alert("Cannot forward: " + (data.error || "Invalid status"));
      }
    })
    .catch(err => alert("Forwarding failed"));
}

function showAll() {
  renderDocs(allDocs);
}

function viewHistory(filename) {
  alert("History tracking not implemented yet.\nFile: " + filename);
}

function searchDocs() {
  const input = document.getElementById('searchInput').value.toLowerCase().trim();
  if (input === "") {
    renderDocs(allDocs);
    return;
  }
  const filtered = allDocs.filter(doc => doc.tracking_id && doc.tracking_id.toLowerCase().includes(input));
  if (filtered.length === 0) {
    document.getElementById('documentsList').innerHTML = `
      <div style="background:white; padding:20px; margin-top:20px; border-radius:10px; text-align:center; color:#ef4444; font-weight:bold;">
        ❌ Tracking ID not found
      </div>
    `;
    return;
  }
  renderDocs(filtered);
}

// Load documents from correct API
window.onload = function() {
  fetch('/api/all_reports')
    .then(res => res.json())
    .then(data => {
      allDocs = data;
      renderDocs(allDocs);
    });
}
</script>
</body>
</html>
