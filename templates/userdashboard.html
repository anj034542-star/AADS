<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Residency Hub | Document Dashboard</title>
  <!-- Google Fonts + Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f4f7fc;
      display: flex;
      min-height: 100vh;
      color: #1e293b;
    }

    /* --- SIDEBAR (modern, glassmorphic touch) --- */
    .sidebar {
      width: 280px;
      background: linear-gradient(145deg, #0f172a 0%, #111827 100%);
      backdrop-filter: blur(2px);
      color: #e2e8f0;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.08);
      z-index: 10;
    }

    .sidebar h2 {
      font-weight: 700;
      font-size: 1.7rem;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 2.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar h2 i {
      background: none;
      -webkit-background-clip: unset;
      background-clip: unset;
      color: #3b82f6;
      font-size: 1.8rem;
    }

    .sidebar a {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      margin: 6px 0;
      color: #cbd5e6;
      text-decoration: none;
      border-radius: 16px;
      font-weight: 500;
      transition: all 0.2s;
      background: transparent;
    }

    .sidebar a i {
      width: 24px;
      font-size: 1.2rem;
    }

    .sidebar a:hover {
      background: rgba(59, 130, 246, 0.2);
      color: white;
      transform: translateX(5px);
    }

    /* --- MAIN CONTENT --- */
    .main {
      flex: 1;
      padding: 2rem 2rem 2rem 2rem;
      overflow-y: auto;
    }

    /* Header area */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, #0f2b3d, #1e4a76);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .btn-primary {
      background: #2563eb;
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 8px rgba(37, 99, 235, 0.2);
      color: white;
    }

    .btn-primary i {
      font-size: 1rem;
    }

    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.3);
    }

    /* search bar */
    .search-wrapper {
      margin-bottom: 1.8rem;
    }

    .search-box {
      background: white;
      border-radius: 60px;
      padding: 5px 18px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      border: 1px solid #e2e8f0;
      transition: all 0.2s;
    }

    .search-box i {
      color: #94a3b8;
    }

    .search-box input {
      border: none;
      padding: 12px 0;
      width: 260px;
      font-size: 0.9rem;
      outline: none;
      background: transparent;
    }

    /* Form card (upload) */
    .form-card {
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(4px);
      padding: 1.8rem;
      margin-top: 1rem;
      margin-bottom: 2rem;
      border-radius: 28px;
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.6);
      transition: all 0.2s;
    }

    .form-card h3 {
      margin-bottom: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input, textarea, .file-label {
      width: 100%;
      padding: 12px 16px;
      margin-top: 12px;
      border-radius: 20px;
      border: 1px solid #e2edf2;
      background: #fefefe;
      font-family: inherit;
      transition: 0.2s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }

    .file-hint {
      font-size: 0.75rem;
      color: #5b6e8c;
      margin-top: 8px;
    }

    /* document cards grid */
    .doc-grid {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      margin-top: 1rem;
    }

    .doc-card {
      background: white;
      border-radius: 24px;
      padding: 1.4rem 1.8rem;
      transition: all 0.25s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
      border: 1px solid #eef2f9;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }

    .doc-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.12);
      border-color: #cddcff;
    }

    .doc-info {
      flex: 2;
      min-width: 220px;
    }

    .doc-title {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tracking-badge {
      background: #f1f5f9;
      font-family: monospace;
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: 40px;
      font-weight: 500;
      color: #1e293b;
    }

    .doc-desc {
      color: #475569;
      margin: 8px 0 6px;
      font-size: 0.9rem;
    }

    .office-meta {
      font-size: 0.75rem;
      color: #5b6e8c;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 8px 0 6px;
    }

    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .status.pending { background: #ffedd5; color: #b45309; }
    .status.approved { background: #dcfce7; color: #15803d; }
    .status.declined { background: #fee2e2; color: #b91c1c; }
    .status.mayor { background: #dbeafe; color: #1e40af; }
    .status.governor { background: #e0e7ff; color: #3730a3; }

    .decline-box {
      background: #fff1f0;
      padding: 8px 12px;
      border-radius: 16px;
      margin-top: 12px;
      font-size: 0.8rem;
      border-left: 4px solid #ef4444;
    }

    .doc-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .btn-icon {
      background: #f8fafc;
      border: none;
      padding: 8px 14px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #1e293b;
    }

    .btn-icon i {
      font-size: 0.8rem;
    }

    .btn-icon.forward {
      background: #eef2ff;
      color: #2563eb;
    }

    .btn-icon.forward:hover {
      background: #2563eb;
      color: white;
      transform: scale(0.97);
    }

    .btn-icon.file {
      background: #e6f7ec;
      color: #0e7b32;
    }

    /* empty state */
    .empty-state {
      background: white;
      border-radius: 32px;
      padding: 3rem;
      text-align: center;
      color: #5b6e8c;
    }

    @media (max-width: 800px) {
      .sidebar {
        width: 100px;
        padding: 1rem 0.5rem;
        align-items: center;
      }
      .sidebar h2 span, .sidebar a span {
        display: none;
      }
      .sidebar h2 i {
        margin: 0 auto;
      }
      .sidebar a {
        justify-content: center;
      }
      .main {
        padding: 1.2rem;
      }
      .doc-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .doc-actions {
        margin-top: 16px;
        width: 100%;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="sidebar">
  <h2><i class="fas fa-file-alt"></i><span>ResiHub</span></h2>
  <a href="#" id="myDocsLink"><i class="fas fa-folder-open"></i><span> My Documents</span></a>
  <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span> Logout</span></a>
</div>

<div class="main">
  <div class="header">
    <h1><i class="fas fa-scroll"></i> Document Flow</h1>
    <button class="btn-primary" id="toggleUploadBtn"><i class="fas fa-plus-circle"></i> Upload New</button>
  </div>

  <div class="search-wrapper">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search by Tracking ID...">
    </div>
  </div>

  <!-- Upload Form Card (hidden by default) -->
  <div class="form-card" id="docForm" style="display: none;">
    <h3><i class="fas fa-cloud-upload-alt"></i> Submit new request</h3>
    <input type="text" id="docTitle" placeholder="Document title (e.g., Barangay Clearance)" autocomplete="off">
    <textarea id="docDesc" rows="2" placeholder="Description / purpose"></textarea>
    <div class="file-hint"><i class="fas fa-info-circle"></i> Allowed: .doc, .docx, .xls, .xlsx</div>
    <input type="file" id="docFile" accept=".doc,.docx,.xls,.xlsx">
    <p style="font-size: 0.75rem; background:#f0f4fe; padding:8px; border-radius:14px; margin-top:12px;">
      <i class="fas fa-building"></i> Documents are always first sent to <strong>Barangay Office</strong> for initial review.
    </p>
    <button class="btn-primary" id="confirmUploadBtn" style="margin-top: 18px; width:auto;"><i class="fas fa-check"></i> Upload document</button>
  </div>

  <!-- Documents container -->
  <div id="documentsList" class="doc-grid"></div>
</div>

<script>
  // ---------- MOCK / LOCALSTORAGE DOCUMENT SYSTEM ----------
  // Complete offline simulation: upload, forward (auto-approves for demo flow),
  // statuses: PENDING -> (approval needed from office, but to showcase forward buttons we rely on sample docs + forward logic)
  // Forwards: if status === "APPROVED BY BARANGAY" -> forward to mayor -> becomes "APPROVED BY MAYOR"
  // if status === "APPROVED BY MAYOR" -> forward to governor -> becomes "APPROVED BY GOVERNOR" (final)
  // Uploaded doc status: "PENDING (BARANGAY)" -> no forward until approved by office (simulate office approval? For demo we let sample docs show flow)
  // But we also add a special admin-sim? No, we provide sample docs already approved.
  // Also provide a "DEMO NOTICE": the system includes ready examples to test forwarding.
  
  let residentDocs = [];

  // Helper: load from localStorage or init sample docs
  function loadDocsFromStorage() {
    const stored = localStorage.getItem("resident_docs_mock");
    if (stored) {
      residentDocs = JSON.parse(stored);
    } else {
      // Create meaningful sample documents showing different stages & decline example
      residentDocs = [
        {
          tracking_id: "BRG-9A2F1",
          title: "Barangay Business Permit",
          desc: "Renewal of sari-sari store permit",
          office: "Barangay Office",
          target_office: "Barangay Office",
          status: "APPROVED BY BARANGAY",
          filename: "business_permit_draft.docx",
          declined_by: null,
          decline_reason: null,
          createdAt: new Date().toISOString()
        },
        {
          tracking_id: "MAY-7C3E9",
          title: "Mayor’s Clearance Request",
          desc: "Clearance for employment abroad",
          office: "Barangay Office",
          target_office: "Mayor's Office",
          status: "APPROVED BY MAYOR",
          filename: "clearance_form.pdf",
          declined_by: null,
          decline_reason: null,
          createdAt: new Date().toISOString()
        },
        {
          tracking_id: "GOV-5B8D2",
          title: "Certificate of Residency",
          desc: "For government benefits",
          office: "Mayor's Office",
          target_office: "Governor's Office",
          status: "APPROVED BY GOVERNOR",
          filename: "res_certificate.xlsx",
          declined_by: null,
          decline_reason: null,
          createdAt: new Date().toISOString()
        },
        {
          tracking_id: "DEC-4F7H9",
          title: "Financial Assistance Request",
          desc: "Medical aid application",
          office: "Barangay Office",
          target_office: "Barangay Office",
          status: "DECLINED BY BARANGAY",
          filename: "aid_form.docx",
          declined_by: "Barangay Secretariat",
          decline_reason: "Incomplete supporting documents. Please re-submit with medical abstract.",
          createdAt: new Date().toISOString()
        }
      ];
      saveToLocalStorage();
    }
    renderDocuments(residentDocs);
  }

  function saveToLocalStorage() {
    localStorage.setItem("resident_docs_mock", JSON.stringify(residentDocs));
  }

  // generate random tracking ID (8 digits)
  function generateTrackingId() {
    return 'TRK-' + Math.random().toString(36).substring(2, 8).toUpperCase();
  }

  // Upload new document (mock)
  function uploadNewDocument(title, desc, fileObj) {
    if (!title || !desc) throw new Error("Title & description required");
    if (!fileObj) throw new Error("File required");
    const allowed = ['doc','docx','xls','xlsx'];
    const ext = fileObj.name.split('.').pop().toLowerCase();
    if (!allowed.includes(ext)) throw new Error("Only Word/Excel files allowed");

    const newDoc = {
      tracking_id: generateTrackingId(),
      title: title.trim(),
      desc: desc.trim(),
      office: "Barangay Office",
      target_office: "Barangay Office",
      status: "PENDING (BARANGAY)",
      filename: fileObj.name,
      declined_by: null,
      decline_reason: null,
      createdAt: new Date().toISOString()
    };
    residentDocs.unshift(newDoc);
    saveToLocalStorage();
    renderDocuments(residentDocs);
    return newDoc;
  }

  // Forward logic: "mayor" or "governor" with status checks
  function forwardDocumentMock(trackingId, targetOffice) {
    const docIndex = residentDocs.findIndex(d => d.tracking_id === trackingId);
    if (docIndex === -1) throw new Error("Document not found");
    const doc = residentDocs[docIndex];
    
    if (targetOffice === "mayor") {
      if (doc.status !== "APPROVED BY BARANGAY") {
        throw new Error("Document must be APPROVED BY BARANGAY before forwarding to Mayor.");
      }
      // Forward to mayor => auto approve by mayor (demo flow)
      doc.status = "APPROVED BY MAYOR";
      doc.target_office = "Mayor's Office";
      doc.office = "Mayor's Office";
    } 
    else if (targetOffice === "governor") {
      if (doc.status !== "APPROVED BY MAYOR") {
        throw new Error("Document must be APPROVED BY MAYOR before forwarding to Governor.");
      }
      doc.status = "APPROVED BY GOVERNOR";
      doc.target_office = "Governor's Office";
      doc.office = "Governor's Office";
    }
    else {
      throw new Error("Invalid forward target");
    }
    saveToLocalStorage();
    renderDocuments(residentDocs);
    return true;
  }

  // Render dynamic cards
  function renderDocuments(docsArray) {
    const container = document.getElementById('documentsList');
    if (!docsArray.length) {
      container.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open fa-2x" style="opacity:0.5"></i><p style="margin-top:12px;">No documents found. Upload a new document to get started.</p></div>`;
      return;
    }

    container.innerHTML = '';
    docsArray.forEach(doc => {
      // determine status style
      let statusClass = "pending";
      let statusDisplay = doc.status;
      if (doc.status.includes("APPROVED BY BARANGAY")) statusClass = "approved";
      else if (doc.status.includes("APPROVED BY MAYOR")) statusClass = "mayor";
      else if (doc.status.includes("APPROVED BY GOVERNOR")) statusClass = "governor";
      else if (doc.status.includes("DECLINED")) statusClass = "declined";
      else statusClass = "pending";

      // Forward button conditions (only when specific approval stage)
      let forwardMayorBtn = "";
      let forwardGovernorBtn = "";
      if (doc.status === "APPROVED BY BARANGAY") {
        forwardMayorBtn = `<button class="btn-icon forward" data-id="${doc.tracking_id}" data-target="mayor"><i class="fas fa-arrow-right"></i> Forward to Mayor</button>`;
      }
      if (doc.status === "APPROVED BY MAYOR") {
        forwardGovernorBtn = `<button class="btn-icon forward" data-id="${doc.tracking_id}" data-target="governor"><i class="fas fa-arrow-right"></i> Forward to Governor</button>`;
      }

      // Decline message if exists
      let declineHtml = "";
      if (doc.decline_reason && doc.status.includes("DECLINED")) {
        declineHtml = `<div class="decline-box"><i class="fas fa-ban"></i> <strong>Declined by ${doc.declined_by || "office"}:</strong> ${doc.decline_reason}</div>`;
      }

      const card = document.createElement('div');
      card.className = 'doc-card';
      card.innerHTML = `
        <div class="doc-info">
          <div class="doc-title">
            <span>${escapeHtml(doc.title)}</span>
            <span class="tracking-badge"><i class="fas fa-hashtag"></i> ${doc.tracking_id}</span>
          </div>
          <div class="doc-desc">${escapeHtml(doc.desc)}</div>
          <div class="office-meta">
            <span><i class="fas fa-location-dot"></i> Current: ${doc.target_office || doc.office}</span>
            <span><i class="far fa-calendar-alt"></i> ${new Date(doc.createdAt).toLocaleDateString()}</span>
          </div>
          <div><span class="status ${statusClass}"><i class="fas fa-circle" style="font-size: 0.5rem; vertical-align: middle;"></i> ${statusDisplay}</span></div>
          ${declineHtml}
        </div>
        <div class="doc-actions">
          <button class="btn-icon file open-file-btn" data-filename="${escapeHtml(doc.filename)}" data-id="${doc.tracking_id}"><i class="fas fa-file-alt"></i> View File</button>
          ${forwardMayorBtn}
          ${forwardGovernorBtn}
        </div>
      `;
      container.appendChild(card);
    });

    // attach event listeners dynamically for forward & file preview
    document.querySelectorAll('.forward').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const trackingId = btn.getAttribute('data-id');
        const target = btn.getAttribute('data-target');
        try {
          forwardDocumentMock(trackingId, target);
          showToast(`✅ Document forwarded to ${target === 'mayor' ? 'Mayor' : 'Governor'}!`, '#15803d');
        } catch (err) {
          showToast(`⚠️ ${err.message}`, '#b91c1c');
        }
      });
    });

    document.querySelectorAll('.open-file-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const fname = btn.getAttribute('data-filename');
        showToast(`📄 Demo: "${fname}" would be opened. (Local simulation)`, '#2563eb');
      });
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function showToast(message, bgColor = '#1f2937') {
    let toast = document.getElementById('dynamic-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'dynamic-toast';
      toast.style.position = 'fixed';
      toast.style.bottom = '24px';
      toast.style.right = '24px';
      toast.style.background = bgColor;
      toast.style.color = 'white';
      toast.style.padding = '12px 24px';
      toast.style.borderRadius = '40px';
      toast.style.fontWeight = '500';
      toast.style.fontSize = '0.85rem';
      toast.style.boxShadow = '0 10px 20px rgba(0,0,0,0.2)';
      toast.style.zIndex = '9999';
      toast.style.backdropFilter = 'blur(8px)';
      document.body.appendChild(toast);
    }
    toast.style.background = bgColor;
    toast.innerHTML = `<i class="fas fa-bell"></i> ${message}`;
    toast.style.display = 'block';
    setTimeout(() => {
      toast.style.display = 'none';
    }, 2800);
  }

  // search by tracking id
  function searchDocuments() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!query) {
      renderDocuments(residentDocs);
      return;
    }
    const filtered = residentDocs.filter(doc => doc.tracking_id.toLowerCase().includes(query));
    if (filtered.length === 0) {
      document.getElementById('documentsList').innerHTML = `<div class="empty-state"><i class="fas fa-search"></i> <strong>No matching Tracking ID</strong><br>Try again with different ID.</div>`;
    } else {
      renderDocuments(filtered);
    }
  }

  // form toggle
  let formVisible = false;
  function toggleForm() {
    const form = document.getElementById('docForm');
    formVisible = !formVisible;
    form.style.display = formVisible ? 'block' : 'none';
  }

  // handle upload from UI
  function handleUpload() {
    const title = document.getElementById('docTitle').value.trim();
    const desc = document.getElementById('docDesc').value.trim();
    const fileInput = document.getElementById('docFile');
    if (!title || !desc) {
      showToast("Please fill in title and description", "#b91c1c");
      return;
    }
    if (!fileInput.files.length) {
      showToast("Please select a Word/Excel file", "#b91c1c");
      return;
    }
    const file = fileInput.files[0];
    try {
      uploadNewDocument(title, desc, file);
      showToast(`Document "${title}" uploaded! Tracking ID generated.`, "#15803d");
      // reset form
      document.getElementById('docTitle').value = '';
      document.getElementById('docDesc').value = '';
      fileInput.value = '';
      document.getElementById('docForm').style.display = 'none';
      formVisible = false;
    } catch (err) {
      showToast(err.message, "#b91c1c");
    }
  }

  // reset view to all docs
  function showAllDocuments() {
    document.getElementById('searchInput').value = '';
    renderDocuments(residentDocs);
  }

  // logout simulation
  function handleLogout() {
    showToast("🔐 Logged out (demo mode). Refresh to reset? Data stays.", "#4b5563");
    setTimeout(() => {
      if(confirm("Demo logout: Clear local data and reload?")) {
        localStorage.removeItem("resident_docs_mock");
        location.reload();
      }
    }, 100);
  }

  // Event listeners
  window.onload = () => {
    loadDocsFromStorage();

    document.getElementById('toggleUploadBtn').addEventListener('click', toggleForm);
    document.getElementById('confirmUploadBtn').addEventListener('click', handleUpload);
    document.getElementById('searchInput').addEventListener('keyup', searchDocuments);
    document.getElementById('myDocsLink').addEventListener('click', (e) => {
      e.preventDefault();
      showAllDocuments();
    });
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      handleLogout();
    });
  };
</script>
</body>
</html>
