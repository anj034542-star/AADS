<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ResidenceHub | Document Dashboard</title>
  <!-- Google Fonts + Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f1f5f9;
      display: flex;
      height: 100vh;
      overflow: hidden;
      color: #0f172a;
    }

    /* --- SIDEBAR MODERN --- */
    .sidebar {
      width: 280px;
      background: linear-gradient(145deg, #0f172a 0%, #111827 100%);
      backdrop-filter: blur(2px);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.08);
      transition: all 0.2s;
      z-index: 10;
    }

    .sidebar-header {
      padding: 32px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar-header h2 {
      font-weight: 600;
      font-size: 1.6rem;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-header h2 i {
      color: #3b82f6;
      font-size: 28px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;
      color: #cbd5e1;
      text-decoration: none;
      border-radius: 16px;
      font-weight: 500;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }

    .sidebar-nav a i {
      width: 24px;
      font-size: 1.2rem;
    }

    .sidebar-nav a:hover {
      background: #1e293b;
      color: white;
      transform: translateX(4px);
    }

    .sidebar-footer {
      padding: 24px 20px 32px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .sidebar-footer a {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #94a3b8;
      text-decoration: none;
      font-weight: 500;
      padding: 10px 12px;
      border-radius: 14px;
      transition: 0.2s;
    }

    .sidebar-footer a:hover {
      background: #1e293b;
      color: #f1f5f9;
    }

    /* --- MAIN PANEL --- */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 28px 36px;
      background: #f8fafc;
    }

    /* header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 28px;
    }

    .page-title h1 {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, #1e293b, #2d3a5e);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }

    .page-title p {
      font-size: 0.85rem;
      color: #475569;
      margin-top: 6px;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
      box-shadow: 0 4px 8px rgba(37,99,235,0.2);
    }

    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 10px 18px rgba(37,99,235,0.25);
    }

    /* stats cards */
    .stats-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .stat-card {
      background: white;
      border-radius: 24px;
      padding: 18px 24px;
      flex: 1;
      min-width: 140px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02), 0 6px 12px -6px rgba(0,0,0,0.05);
      border: 1px solid #e9eef3;
      transition: all 0.2s;
    }

    .stat-card i {
      font-size: 28px;
      color: #3b82f6;
      background: #eef2ff;
      padding: 10px;
      border-radius: 20px;
    }

    .stat-card h3 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-top: 12px;
    }

    .stat-card p {
      color: #475569;
      font-size: 0.8rem;
      font-weight: 500;
    }

    /* filter bar */
    .filter-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .status-filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-chip {
      background: white;
      border: 1px solid #e2e8f0;
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      color: #334155;
    }

    .filter-chip.active {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
      box-shadow: 0 4px 8px rgba(37,99,235,0.2);
    }

    .search-wrapper {
      display: flex;
      align-items: center;
      background: white;
      border-radius: 60px;
      padding: 6px 18px;
      border: 1px solid #e2e8f0;
    }

    .search-wrapper i {
      color: #94a3b8;
    }

    #searchInput {
      border: none;
      padding: 10px 12px;
      width: 240px;
      outline: none;
      font-size: 0.85rem;
      background: transparent;
    }

    /* upload card form */
    .form-card {
      background: white;
      border-radius: 28px;
      padding: 24px 28px;
      margin-bottom: 28px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.03);
      border: 1px solid #eef2ff;
      transition: all 0.2s;
    }

    .form-card input, .form-card textarea, .form-card .file-area {
      width: 100%;
      padding: 12px 16px;
      margin-top: 8px;
      margin-bottom: 18px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      font-family: 'Inter', monospace;
      transition: 0.2s;
    }

    .form-card textarea {
      resize: vertical;
    }

    .form-card input:focus, .form-card textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }

    .file-note {
      font-size: 0.7rem;
      color: #64748b;
      margin-top: -12px;
      margin-bottom: 16px;
    }

    /* document cards */
    .documents-container {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .doc-card {
      background: white;
      border-radius: 24px;
      padding: 20px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
      border: 1px solid #eef2f8;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }

    .doc-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 25px -12px rgba(0,0,0,0.08);
      border-color: #cbdff2;
    }

    .doc-info {
      flex: 2;
    }

    .doc-title {
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tracking-badge {
      background: #f1f5f9;
      font-size: 0.7rem;
      padding: 4px 12px;
      border-radius: 40px;
      font-family: monospace;
      font-weight: 500;
      color: #1e293b;
    }

    .doc-desc {
      color: #334155;
      font-size: 0.85rem;
      margin: 8px 0 8px;
    }

    .office-status {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      margin-top: 8px;
      font-size: 0.75rem;
    }

    .status-badge {
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 0.7rem;
      background: #f1f5f9;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge.pending { background: #fffbeb; color: #b45309; border-left: 3px solid #f59e0b; }
    .status-badge.approved { background: #ecfdf5; color: #047857; border-left: 3px solid #10b981; }
    .status-badge.declined { background: #fef2f2; color: #b91c1c; border-left: 3px solid #ef4444; }

    .decline-message {
      background: #fef2f2;
      border-radius: 16px;
      padding: 10px 14px;
      margin-top: 12px;
      font-size: 0.75rem;
      color: #991b1b;
    }

    .doc-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .action-btn {
      background: transparent;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 40px;
      transition: 0.2s;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn.outline {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
    }

    .action-btn.forward {
      background: #eef2ff;
      color: #1e40af;
    }

    .action-btn.approve-demo {
      background: #e6f7e6;
      color: #166534;
    }

    .action-btn.delete {
      background: #fee2e2;
      color: #b91c1c;
    }
    .action-btn.delete:hover {
      background: #fecaca;
      transform: scale(0.97);
    }

    .empty-state {
      background: white;
      border-radius: 32px;
      padding: 48px;
      text-align: center;
      color: #475569;
    }

    @media (max-width: 780px) {
      .sidebar { width: 80px; overflow-x: hidden; }
      .sidebar-header h2 span, .sidebar-nav a span, .sidebar-footer a span { display: none; }
      .sidebar-nav a i, .sidebar-footer a i { margin: 0 auto; }
      .sidebar-header h2 i { margin: 0 auto; }
      .sidebar { align-items: center; }
      .main { padding: 20px; }
    }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h2><i class="fas fa-file-alt"></i> <span>ResidenceHub</span></h2>
  </div>
  <div class="sidebar-nav">
    <a href="#" onclick="filterStatusGlobal('all'); return false;"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a>
    <a href="#" onclick="filterStatusGlobal('all'); return false;"><i class="fas fa-folder-open"></i> <span>My Documents</span></a>
  </div>
  <div class="sidebar-footer">
    <a href="#" onclick="alert('Logout simulation — secure exit'); return false;"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
  </div>
</div>

<div class="main">
  <div class="top-bar">
    <div class="page-title">
      <h1>Document Dashboard</h1>
      <p>Track submissions, forward requests, and monitor status</p>
    </div>
    <button class="btn-primary" onclick="toggleUploadForm()"><i class="fas fa-plus-circle"></i> Upload New</button>
  </div>

  <!-- stats cards -->
  <div class="stats-grid" id="statsContainer"></div>

  <!-- filter + search -->
  <div class="filter-section">
    <div class="status-filters" id="filterGroup">
      <button class="filter-chip active" data-filter="all">All</button>
      <button class="filter-chip" data-filter="pending">Pending</button>
      <button class="filter-chip" data-filter="approved_barangay">Approved (Brgy)</button>
      <button class="filter-chip" data-filter="approved_mayor">Approved (Mayor)</button>
      <button class="filter-chip" data-filter="declined">Declined</button>
    </div>
    <div class="search-wrapper">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Tracking ID...">
    </div>
  </div>

  <!-- upload form (hidden by default) -->
  <div id="uploadFormContainer" style="display: none;">
    <div class="form-card">
      <h3 style="margin-bottom: 10px;"><i class="fas fa-cloud-upload-alt"></i> New document request</h3>
      <input type="text" id="docTitle" placeholder="Document title *">
      <textarea id="docDesc" rows="2" placeholder="Brief description *"></textarea>
      <div class="file-area">
        <input type="file" id="docFile" accept=".doc,.docx,.xls,.xlsx">
        <div class="file-note">📄 Allowed: Word / Excel files</div>
      </div>
      <button class="btn-primary" style="width:100%; justify-content:center;" onclick="saveNewDocument()"><i class="fas fa-paper-plane"></i> Submit Document</button>
    </div>
  </div>

  <!-- documents list -->
  <div id="documentsList" class="documents-container"></div>
</div>

<script>
  // ---------- LOCALSTORAGE MANAGEMENT (NO PAST DOCUMENTS BY DEFAULT) ----------
  let residentDocs = [];

  // Load from localStorage, if empty -> empty array (no sample docs)
  function loadFromStorage() {
    const stored = localStorage.getItem('resident_dashboard_docs');
    if (stored) {
      residentDocs = JSON.parse(stored);
    } else {
      // START TOTALLY EMPTY – no preloaded documents
      residentDocs = [];
      localStorage.setItem('resident_dashboard_docs', JSON.stringify(residentDocs));
    }
  }

  function saveToLocalStorage() {
    localStorage.setItem('resident_dashboard_docs', JSON.stringify(residentDocs));
  }

  // Helper: generate random tracking ID (short, readable)
  function generateTracking() {
    const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    const randNum = Math.floor(1000 + Math.random() * 9000);
    return `${letters[Math.floor(Math.random()*letters.length)]}${letters[Math.floor(Math.random()*letters.length)]}-${randNum}`;
  }

  // Update statistics cards based on current residentDocs
  function updateStats() {
    const total = residentDocs.length;
    const pending = residentDocs.filter(d => d.status === "PENDING").length;
    const approved = residentDocs.filter(d => d.status === "APPROVED BY BARANGAY" || d.status === "APPROVED BY MAYOR" || d.status === "APPROVED BY GOVERNOR").length;
    const declined = residentDocs.filter(d => d.status === "DECLINED").length;
    document.getElementById('statsContainer').innerHTML = `
      <div class="stat-card"><i class="fas fa-file-alt"></i><h3>${total}</h3><p>Total Documents</p></div>
      <div class="stat-card"><i class="fas fa-clock"></i><h3>${pending}</h3><p>Pending</p></div>
      <div class="stat-card"><i class="fas fa-check-circle"></i><h3>${approved}</h3><p>Approved</p></div>
      <div class="stat-card"><i class="fas fa-ban"></i><h3>${declined}</h3><p>Declined</p></div>
    `;
  }

  let activeFilter = "all";

  // Render documents with filters, search, and DELETE button
  function renderDocuments() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
    let filtered = [...residentDocs];
    
    // status filter
    if (activeFilter !== "all") {
      if (activeFilter === "pending") filtered = filtered.filter(d => d.status === "PENDING");
      else if (activeFilter === "approved_barangay") filtered = filtered.filter(d => d.status === "APPROVED BY BARANGAY");
      else if (activeFilter === "approved_mayor") filtered = filtered.filter(d => d.status === "APPROVED BY MAYOR");
      else if (activeFilter === "declined") filtered = filtered.filter(d => d.status === "DECLINED");
    }
    
    // search by tracking ID
    if (searchTerm !== "") {
      filtered = filtered.filter(d => d.tracking_id && d.tracking_id.toLowerCase().includes(searchTerm));
    }
    
    const container = document.getElementById('documentsList');
    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty-state"><i class="fas fa-trash-alt" style="font-size: 40px; opacity: 0.5;"></i><h3>No documents found</h3><p>Click "Upload New" to add your first document.</p></div>`;
      updateStats();
      return;
    }
    
    container.innerHTML = filtered.map(doc => {
      let statusClass = "pending";
      let displayStatus = doc.status;
      if (doc.status === "APPROVED BY BARANGAY") statusClass = "approved";
      else if (doc.status === "APPROVED BY MAYOR") statusClass = "approved";
      else if (doc.status === "APPROVED BY GOVERNOR") statusClass = "approved";
      else if (doc.status === "DECLINED") statusClass = "declined";
      else statusClass = "pending";
      
      // forward button logic
      let forwardButton = "";
      let demoApproveButton = "";
      
      if (doc.status === "APPROVED BY BARANGAY") {
        forwardButton = `<button class="action-btn forward" onclick="forwardDocument('${doc.id}', 'mayor')"><i class="fas fa-share"></i> Forward to Mayor</button>`;
      } else if (doc.status === "APPROVED BY MAYOR") {
        forwardButton = `<button class="action-btn forward" onclick="forwardDocument('${doc.id}', 'governor')"><i class="fas fa-share"></i> Forward to Governor</button>`;
      }
      
      // Demo approve for pending documents (user can simulate approval)
      if (doc.status === "PENDING") {
        demoApproveButton = `<button class="action-btn approve-demo" onclick="mockApproveByBarangay('${doc.id}')"><i class="fas fa-thumbs-up"></i> Mock Approve (Brgy)</button>`;
      }
      
      const declineHtml = (doc.status === "DECLINED" && doc.decline_reason) ? 
        `<div class="decline-message"><i class="fas fa-info-circle"></i> <strong>${doc.declined_by || 'Office'} declined:</strong> ${escapeHtml(doc.decline_reason)}</div>` : '';
      
      return `
        <div class="doc-card">
          <div class="doc-info">
            <div class="doc-title">
              <span><i class="fas fa-file-pdf" style="color:#2563eb;"></i> ${escapeHtml(doc.title)}</span>
              <span class="tracking-badge"><i class="fas fa-qrcode"></i> ${doc.tracking_id}</span>
            </div>
            <div class="doc-desc">${escapeHtml(doc.desc)}</div>
            <div class="office-status">
              <span><i class="fas fa-building"></i> Current: ${doc.target_office || "Barangay Office"}</span>
              <span class="status-badge ${statusClass}"><i class="fas ${doc.status === 'DECLINED' ? 'fa-times-circle' : 'fa-circle'}"></i> ${displayStatus}</span>
            </div>
            ${declineHtml}
          </div>
          <div class="doc-actions">
            <button class="action-btn outline" onclick="simulateOpenFile('${doc.filename}')"><i class="fas fa-eye"></i> Open</button>
            ${demoApproveButton}
            ${forwardButton}
            <!-- DELETE ICON / BUTTON -->
            <button class="action-btn delete" onclick="deleteDocument('${doc.id}')"><i class="fas fa-trash-alt"></i> Delete</button>
          </div>
        </div>
      `;
    }).join('');
    updateStats();
  }
  
  function escapeHtml(str) { 
    if(!str) return '';
    return str.replace(/[&<>]/g, function(m){
      if(m==='&') return '&amp;';
      if(m==='<') return '&lt;';
      if(m==='>') return '&gt;';
      return m;
    }); 
  }
  
  // ---------- DELETE DOCUMENT FUNCTIONALITY ----------
  function deleteDocument(docId) {
    if (confirm("⚠️ Are you sure you want to delete this document? This action cannot be undone.")) {
      const newDocs = residentDocs.filter(doc => doc.id !== docId);
      if (newDocs.length === residentDocs.length) {
        showToast("Document not found", "error");
        return;
      }
      residentDocs = newDocs;
      saveToLocalStorage();
      renderDocuments();
      showToast("Document permanently deleted", "success");
    }
  }
  
  // ---------- FORWARD LOGIC (mock workflow) ----------
  function forwardDocument(docId, target) {
    const docIndex = residentDocs.findIndex(d => d.id === docId);
    if (docIndex === -1) return;
    const doc = residentDocs[docIndex];
    if (target === 'mayor' && doc.status === "APPROVED BY BARANGAY") {
      doc.status = "APPROVED BY MAYOR";
      doc.target_office = "Mayor's Office";
      saveToLocalStorage();
      renderDocuments();
      showToast("Document forwarded to Mayor's Office ✅", "success");
    } else if (target === 'governor' && doc.status === "APPROVED BY MAYOR") {
      doc.status = "APPROVED BY GOVERNOR";
      doc.target_office = "Governor's Office";
      saveToLocalStorage();
      renderDocuments();
      showToast("Document forwarded to Governor's Office ✅", "success");
    } else {
      showToast("Cannot forward: invalid status or workflow step", "error");
    }
  }
  
  // mock barangay approval (demo)
  function mockApproveByBarangay(docId) {
    const docIndex = residentDocs.findIndex(d => d.id === docId);
    if (docIndex !== -1 && residentDocs[docIndex].status === "PENDING") {
      residentDocs[docIndex].status = "APPROVED BY BARANGAY";
      residentDocs[docIndex].target_office = "Barangay Hall (Approved)";
      saveToLocalStorage();
      renderDocuments();
      showToast("(Demo) Barangay approval granted! Now you can forward to Mayor.", "info");
    } else {
      showToast("Document not pending or already approved.", "error");
    }
  }
  
  // Save new document from upload form
  function saveNewDocument() {
    const title = document.getElementById('docTitle').value.trim();
    const desc = document.getElementById('docDesc').value.trim();
    const fileInput = document.getElementById('docFile');
    
    if (!title || !desc) {
      showToast("Title and description required", "error");
      return;
    }
    if (!fileInput.files.length) {
      showToast("Please select a file (.doc, .docx, .xls, .xlsx)", "error");
      return;
    }
    const file = fileInput.files[0];
    const ext = file.name.split('.').pop().toLowerCase();
    if (!['doc', 'docx', 'xls', 'xlsx'].includes(ext)) {
      showToast("Only Word/Excel files allowed", "error");
      return;
    }
    
    const newId = 'doc_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    const newDoc = {
      id: newId,
      tracking_id: generateTracking(),
      title: title,
      desc: desc,
      status: "PENDING",
      target_office: "Barangay Hall",
      decline_reason: null,
      declined_by: null,
      filename: file.name,
      date_upload: new Date().toISOString()
    };
    residentDocs.unshift(newDoc);
    saveToLocalStorage();
    // reset form
    document.getElementById('docTitle').value = '';
    document.getElementById('docDesc').value = '';
    fileInput.value = '';
    document.getElementById('uploadFormContainer').style.display = 'none';
    renderDocuments();
    showToast(`✅ "${title}" uploaded! Tracking ID: ${newDoc.tracking_id}`, "success");
  }
  
  function toggleUploadForm() {
    const formDiv = document.getElementById('uploadFormContainer');
    formDiv.style.display = formDiv.style.display === 'none' ? 'block' : 'none';
  }
  
  function simulateOpenFile(filename) {
    showToast(`📄 Preview: ${filename} (demo mode - document would open here)`, "info");
  }
  
  // Toast notification
  function showToast(message, type = "info") {
    let toastDiv = document.getElementById('dynamic-toast');
    if (!toastDiv) {
      toastDiv = document.createElement('div');
      toastDiv.id = 'dynamic-toast';
      toastDiv.style.position = 'fixed';
      toastDiv.style.bottom = '24px';
      toastDiv.style.right = '24px';
      toastDiv.style.backgroundColor = '#0f172a';
      toastDiv.style.color = 'white';
      toastDiv.style.padding = '12px 20px';
      toastDiv.style.borderRadius = '40px';
      toastDiv.style.fontSize = '0.85rem';
      toastDiv.style.zIndex = '999';
      toastDiv.style.boxShadow = '0 10px 20px rgba(0,0,0,0.2)';
      toastDiv.style.fontWeight = '500';
      document.body.appendChild(toastDiv);
    }
    if (type === 'error') toastDiv.style.backgroundColor = '#b91c1c';
    else if (type === 'success') toastDiv.style.backgroundColor = '#047857';
    else toastDiv.style.backgroundColor = '#1e293b';
    toastDiv.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle'}"></i> ${message}`;
    toastDiv.style.opacity = '1';
    toastDiv.style.display = 'block';
    setTimeout(() => {
      toastDiv.style.opacity = '0';
      setTimeout(() => { if(toastDiv) toastDiv.style.display = 'none'; }, 400);
    }, 2800);
  }
  
  // Filter handlers
  function filterStatusGlobal(filter) {
    activeFilter = filter;
    document.querySelectorAll('.filter-chip').forEach(chip => {
      if (chip.getAttribute('data-filter') === filter) chip.classList.add('active');
      else chip.classList.remove('active');
    });
    renderDocuments();
  }
  
  function attachEvents() {
    document.getElementById('searchInput').addEventListener('keyup', () => renderDocuments());
    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', (e) => {
        filterStatusGlobal(chip.getAttribute('data-filter'));
      });
    });
  }
  
  // Initialize: load from storage (empty by default), attach events, render
  function init() {
    loadFromStorage();   // ensures empty array if no data
    attachEvents();
    renderDocuments();
  }
  
  // Expose functions globally for onclick
  window.filterStatusGlobal = filterStatusGlobal;
  window.toggleUploadForm = toggleUploadForm;
  window.saveNewDocument = saveNewDocument;
  window.forwardDocument = forwardDocument;
  window.mockApproveByBarangay = mockApproveByBarangay;
  window.simulateOpenFile = simulateOpenFile;
  window.deleteDocument = deleteDocument;
  window.showToast = showToast;
  
  init();
</script>
</body>
</html>
