<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Registration System</title>
    <style>
        :root {
            --primary-color: #0300bd;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --border-radius: 8px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .reg-card {
            background: white;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            text-align: center;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.2s;
        }

        .register-btn:hover {
            opacity: 0.9;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            display: none;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

<div class="reg-card">
    <h2>Barangay Registration</h2>
    
    <form id="signupForm">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Choose a unique username" required autocomplete="off">
        </div>

        <div class="form-group">
            <label>Professional Unique ID</label>
            <input type="text" placeholder="System will generate your UID" disabled style="background-color: #eee; cursor: not-allowed;">
            <small style="color: #666;">You will receive your Unique ID after clicking register.</small>
        </div>

        <button type="submit" class="register-btn">Complete Registration</button>
    </form>
    <div id="message" class="message"></div>
</div>

<script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = this.querySelector('input[name="username"]').value.trim();
        const messageDiv = document.getElementById('message');
        const submitBtn = this.querySelector('.register-btn');
        
        if (!username) {
            showMessage('Please enter a username.', 'error');
            return;
        }
        
        // Disable button to prevent double submission
        submitBtn.disabled = true;
        submitBtn.textContent = 'Registering...';
        
        try {
            const response = await fetch('/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `username=${encodeURIComponent(username)}`
            });
            
            const text = await response.text();
            
            // Check success: the backend returns "Registered! Your ID: ..."
            if (text.includes('Registered! Your ID:')) {
                showMessage('Account created successfully! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } else if (text.includes('Username already taken')) {
                showMessage('Username already taken. Please choose another.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Complete Registration';
            } else {
                showMessage('Registration failed. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Complete Registration';
            }
        } catch (err) {
            console.error(err);
            showMessage('Network error. Please check your connection.', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Complete Registration';
        }
    });
    
    function showMessage(msg, type) {
        const msgDiv = document.getElementById('message');
        msgDiv.textContent = msg;
        msgDiv.className = `message ${type}`;
        msgDiv.style.display = 'block';
        if (type !== 'success') {
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 4000);
        }
    }
</script>
</body>
</html>
