<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  display: flex;
  background: #f5f6f7;
}

/* SIDEBAR */
.sidebar {
  width: 260px;
  height: 100vh;
  background: linear-gradient(180deg, #0f172a, #020617);
  color: white;
  padding: 20px;
}

.sidebar h2 {
  margin-bottom: 20px;
}

.sidebar p {
  font-size: 13px;
  color: #94a3b8;
}

/* MAIN */
.main {
  flex: 1;
  padding: 30px;
}

.header {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.card {
  background: white;
  padding: 18px;
  margin-bottom: 15px;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
  border-left: 6px solid #6366f1;
}

/* BUTTONS */
.btn {
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin-right: 5px;
}

.open { background: #2563eb; color: white; }
.approve { background: #16a34a; color: white; }
.decline { background: #dc2626; color: white; }

.status {
  font-weight: bold;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>Provincial Office</h2>
  <p>Final Approval Authority System</p>
  <a href="/logout" style="color:white;">Logout</a>
</div>

<div class="main">

  <div class="header">
    <h1>Governor Dashboard</h1>
    <p>Final review of Mayor-approved documents</p>
  </div>

  <div id="docList"></div>

</div>

<script>

function loadDocs() {
  fetch('/office3/documents')
    .then(res => res.json())
    .then(data => {
      const list = document.getElementById('docList');
      list.innerHTML = '';

      data.forEach(doc => {
        const div = document.createElement('div');
        div.className = "card";

        let color = "#f59e0b";
        if (doc.status.includes("APPROVED")) color = "#16a34a";
        if (doc.status.includes("DECLINED")) color = "#dc2626";

        div.innerHTML = `
          <h3>${doc.title}</h3>
          <p>${doc.desc}</p>
          <p><b>Office:</b> ${doc.office}</p>

          <p class="status" style="color:${color}">
            ${doc.status}
          </p>

          <button class="btn open" onclick="openFile('${doc.filename}')">Open</button>
          <button class="btn approve" onclick="approve('${doc.filename}')">Approve</button>
          <button class="btn decline" onclick="decline('${doc.filename}')">Decline</button>
        `;

        list.appendChild(div);
      });
    });
}

function openFile(filename) {
  window.open(`/uploads/${filename}`, '_blank');
}

function approve(filename) {
  fetch(`/governor/approve/${filename}`, { method: 'POST' })
    .then(() => loadDocs());
}

function decline(filename) {
  fetch(`/governor/decline/${filename}`, { method: 'POST' })
    .then(() => loadDocs());
}

window.onload = loadDocs;

</script>

</body>
</html>
