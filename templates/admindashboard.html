<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Office - Document Management</title>
    <style>
        :root {
            --primary: #2563eb;
            --sidebar-bg: #1e293b;
            --bg-body: #f8fafc;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar - Professional Slate */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            color: white;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 20px 12px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            color: #cbd5e1;
            text-decoration: none;
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        /* Main Area */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-body);
        }

        .top-nav {
            height: 64px;
            background: white;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 40px;
            justify-content: space-between;
        }

        .content-area {
            padding: 30px 40px;
            max-width: 1200px;
        }

        .page-title {
            margin-bottom: 24px;
        }

        .page-title h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .page-title p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Table-like Cards */
        .card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
            transition: box-shadow 0.2s;
        }

        .card:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .tracking-id {
            font-family: monospace;
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #475569;
        }

        .card-desc {
            font-size: 0.95rem;
            color: #475569;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        /* Status Tags */
        .status {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .status-pending { background: #fef3c7; color: #92400e; }
        .status-approved { background: #dcfce7; color: #166534; }
        .status-declined { background: #fee2e2; color: #991b1b; }

        /* Buttons */
        .action-group {
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            display: flex;
            gap: 10px;
        }

        .btn {
            font-size: 0.85rem;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .btn-open { background: white; border-color: var(--border-color); color: var(--text-main); }
        .btn-open:hover { background: #f8fafc; }

        .btn-approve { background: var(--primary); color: white; }
        .btn-approve:hover { background: #1d4ed8; }

        .btn-decline { background: white; border-color: #fca5a5; color: #dc2626; }
        .btn-decline:hover { background: #fef2f2; }

        .empty-state {
            text-align: center;
            padding: 80px;
            background: white;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; }
            .top-nav { padding: 0 20px; }
            .content-area { padding: 20px; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-header">
        <h2>Barangay OFFICE</h2>
    </div>
    <nav class="sidebar-nav">
        <a href="#">Dashboard</a>
        <a href="#">All Documents</a>
        <a href="#">Archives</a>
        <div style="margin-top: 40px; padding: 0 12px;">
             <a href="/logout" style="border: 1px solid rgba(255,255,255,0.2)">Logout</a>
        </div>
    </nav>
</aside>

<div class="main">
    <header class="top-nav">
        <div class="breadcrumb" style="color: var(--text-muted); font-size: 0.85rem;">
            Records / Incoming
        </div>
        <div class="user-profile" style="font-size: 0.85rem; font-weight: 500;">
            Administrator
        </div>
    </header>

    <main class="content-area">
        <div class="page-title">
            <h1>Document Queue</h1>
            <p>Review and process incoming resident applications and requests.</p>
        </div>
        
        <div id="docList"></div>
    </main>
</div>

<script>
    function loadDocs() {
        fetch('/office1/documents')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('docList');
                if (!data.length) {
                    container.innerHTML = '<div class="empty-state">No pending documents to review.</div>';
                    return;
                }
                container.innerHTML = '';
                data.forEach(doc => {
                    let statusClass = 'status-pending';
                    let statusText = doc.status || 'PENDING';
                    if (doc.status.includes('APPROVED')) statusClass = 'status-approved';
                    if (doc.status.includes('DECLINED')) statusClass = 'status-declined';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header">
                            <div>
                                <h3>${escapeHtml(doc.title)}</h3>
                                <span class="tracking-id">Ref: ${doc.tracking_id}</span>
                            </div>
                            <span class="status ${statusClass}">${statusText}</span>
                        </div>
                        <p class="card-desc">${escapeHtml(doc.desc)}</p>
                        <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 15px;">Department: ${doc.office}</p>
                        <div class="action-group">
                            <button class="btn btn-open" onclick="openFile('${doc.filename}')">View Document</button>
                            <button class="btn btn-approve" onclick="approve('${doc.filename}')">Approve</button>
                            <button class="btn btn-decline" onclick="decline('${doc.filename}')">Decline</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
    }

    function openFile(filename) {
        window.open(`/uploads/${filename}`, '_blank');
    }

    function approve(filename) {
        fetch(`/approve/${filename}`, { method: 'POST' })
            .then(() => loadDocs());
    }

    function decline(filename) {
        let reason = prompt("Enter official reason for rejection:");
        if (reason === null) return;
        if (reason.trim() === "") reason = "Documentation incomplete or incorrect";
        fetch(`/decline/${filename}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reason: reason })
        }).then(() => loadDocs());
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    window.onload = loadDocs;
</script>
</body>
</html>
