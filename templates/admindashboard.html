<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  display: flex;
  background: #f1f5f9;
}

.sidebar {
  width: 240px;
  height: 100vh;
  background: #0f172a;
  color: white;
  padding: 20px;
}

.sidebar h2 {
  text-align: center;
  margin-bottom: 40px;
}

.main {
  flex: 1;
  padding: 30px;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

button {
  padding: 6px 12px;
  margin-right: 5px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.approve {
  background: #22c55e;
  color: white;
}

.decline {
  background: #ef4444;
  color: white;
}

.open {
  background: #2563eb;
  color: white;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>Barangay Panel</h2>
  <p>Review & Approve Documents</p>
  <a href="/logout" style="color:white;">Logout</a>
</div>

<div class="main">
  <h1>Incoming Documents</h1>
  <div id="docList"></div>
</div>

<script>

function loadDocs() {
  fetch('/office1/documents')
    .then(res => res.json())
    .then(data => {
      const list = document.getElementById('docList');
      list.innerHTML = '';

      data.forEach(doc => {
        const div = document.createElement('div');
        div.className = "card";

        let statusColor = "#f59e0b";
        if (doc.status.includes("APPROVED")) statusColor = "#22c55e";
        if (doc.status.includes("DECLINED")) statusColor = "#ef4444";

        div.innerHTML = `
          <h3>${doc.title}</h3>
          <p>${doc.desc}</p>
          <p><b>Office:</b> ${doc.office}</p>

          <p style="color:${statusColor}; font-weight:bold;">
            ${doc.status}
          </p>

          <button class="open" onclick="openFile('${doc.filename}')">Open</button>
          <button class="approve" onclick="approve('${doc.filename}')">Approve</button>
          <button class="decline" onclick="decline('${doc.filename}')">Decline</button>
        `;

        list.appendChild(div);
      });
    });
}

function openFile(filename) {
  window.open(`/uploads/${filename}`, '_blank');
}

function approve(filename) {
  fetch(`/approve/${filename}`, { method: 'POST' })
    .then(() => loadDocs());
}

function decline(filename) {
  fetch(`/decline/${filename}`, { method: 'POST' })
    .then(() => loadDocs());
}

window.onload = loadDocs;

</script>

</body>
</html>
