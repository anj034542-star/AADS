<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Upload Document</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="main">

  <h1>Upload Document</h1>

  <div class="form-card" style="display:block;">
    <input type="text" id="docTitle" placeholder="Title">
    <textarea id="docDesc" placeholder="Description"></textarea>

    <select id="docOffice">
      <option value="">Select Office</option>
      <option value="Office 1">Office 1</option>
      <option value="Office 2">Office 2</option>
      <option value="Office 3">Office 3</option>
    </select>

    <input type="file" id="docFile" accept=".doc,.docx,.xls,.xlsx">

    <button class="btn" onclick="saveDocument()">Upload</button>
    <button class="btn" onclick="goBack()">⬅ Back</button>
  </div>

</div>

<script src="upload.js"></script>

<script>
function goBack() {
  window.location.href = "userdashboard.html";
}
</script>

</body>
</html>
