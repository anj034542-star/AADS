<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Mayor Office - Document Management</title>
    <style>
        :root {
            --office-primary: #312e81; /* Indigo 900 */
            --office-bg: #f8fafc;
            --sidebar-dark: #0f172a;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--office-bg);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar - Formal Professional */
        .sidebar {
            width: 260px;
            background: var(--sidebar-dark);
            color: white;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header {
            padding: 30px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar h2 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .sidebar p {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .sidebar-nav {
            padding: 20px 12px;
            flex-grow: 1;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.08);
            color: white;
        }

        /* Main Content Workspace */
        .main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 24px;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--sidebar-dark);
        }

        .header p {
            font-size: 0.95rem;
            color: #64748b;
            margin-top: 4px;
        }

        /* Document "Folder" Cards */
        .card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            transition: box-shadow 0.2s;
        }

        .card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--sidebar-dark);
        }

        .tracking-label {
            font-family: monospace;
            font-size: 0.85rem;
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 4px;
            color: #475569;
        }

        .card p {
            font-size: 0.95rem;
            color: #475569;
            line-height: 1.5;
            margin: 8px 0;
        }

        /* Office Status Tags */
        .status {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
            margin: 12px 0;
        }

        .status-pending { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
        .status-approved { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .status-declined { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        /* Professional Action Buttons */
        .action-bar {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-open { background: white; color: var(--office-primary); }
        .btn-open:hover { background: #f8fafc; border-color: var(--office-primary); }

        .btn-approve { background: var(--office-primary); color: white; border: none; }
        .btn-approve:hover { background: #1e1b4b; }

        .btn-decline { background: white; color: #dc2626; border-color: #fca5a5; }
        .btn-decline:hover { background: #fef2f2; }

        .empty-state {
            text-align: center;
            padding: 80px 40px;
            background: white;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            color: #94a3b8;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; }
            .main { padding: 20px; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-header">
        <h2>Mayor's Office</h2>
        <p>Document Control Center</p>
    </div>
    <nav class="sidebar-nav">
        <a href="#">📋 Pending Review</a>
        <a href="#">📂 Archive</a>
        <a href="#">📊 System Logs</a>
        <a href="/logout" style="margin-top: 20px; border: 1px solid rgba(255,255,255,0.2)">Sign Out</a>
    </nav>
</aside>

<main class="main">
    <div class="header">
        <h1>Executive Approval Queue</h1>
        <p>Review and verify documents forwarded from Barangay departments.</p>
    </div>
    <div id="docList"></div>
</main>

<script>
    function loadDocs() {
        fetch('/office2/documents')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('docList');
                if (!data.length) {
                    container.innerHTML = '<div class="empty-state">No documents currently require executive attention.</div>';
                    return;
                }
                container.innerHTML = '';
                data.forEach(doc => {
                    let statusClass = 'status-pending';
                    let statusText = doc.status || 'PENDING REVIEW';
                    if (doc.status.includes('APPROVED')) statusClass = 'status-approved';
                    if (doc.status.includes('DECLINED')) statusClass = 'status-declined';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-top">
                            <h3>${escapeHtml(doc.title)}</h3>
                            <span class="tracking-label">ID: ${doc.tracking_id}</span>
                        </div>
                        <p>${escapeHtml(doc.desc)}</p>
                        <p style="font-size: 0.85rem; color: #94a3b8;">Forwarded by: ${doc.office}</p>
                        <span class="status ${statusClass}">${statusText}</span>
                        <div class="action-bar">
                            <button class="btn btn-open" onclick="openFile('${doc.filename}')">View Full File</button>
                            <button class="btn btn-approve" onclick="approve('${doc.filename}')">Approve Entry</button>
                            <button class="btn btn-decline" onclick="decline('${doc.filename}')">Decline Entry</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
    }

    function openFile(filename) {
        window.open(`/uploads/${filename}`, '_blank');
    }

    function approve(filename) {
        fetch(`/mayor/approve/${filename}`, { method: 'POST' })
            .then(() => loadDocs());
    }

    function decline(filename) {
        let reason = prompt("State official reason for declining:");
        if (reason === null) return;
        if (reason.trim() === "") reason = "Documentation requirements not met";
        fetch(`/mayor/decline/${filename}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reason: reason })
        }).then(() => loadDocs());
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    window.onload = loadDocs;
</script>
</body>
</html>
