<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap5.min.css">
    <style>
        .badge { font-size: 0.85rem; }
        .card-header { font-weight: bold; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4 shadow">
    <div class="container">
        <span class="navbar-brand">System Reports Dashboard</span>
        <div>
            <a href="/userdashboard" class="btn btn-outline-light btn-sm me-2">User Dashboard</a>
            <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 text-primary">Master Document Report</h5>
        </div>
        <div class="card-body">
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <label class="form-label fw-bold">Status Filter</label>
                    <select id="reportType" class="form-select">
                        <option value="all">All Statuses</option>
                        <option value="PENDING">Pending Only</option>
                        <option value="APPROVED BY BARANGAY">Approved by Barangay</option>
                        <option value="APPROVED BY MAYOR">Approved by Mayor</option>
                        <option value="APPROVED BY GOVERNOR">Final Approved</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Office Filter</label>
                    <select id="officeFilter" class="form-select">
                        <option value="">All Offices</option>
                        <option value="Barangay Officials">Barangay Officials</option>
                        <option value="City Mayor">City Mayor</option>
                        <option value="Provincial Governor">Provincial Governor</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Search Keywords</label>
                    <input type="text" id="customSearch" class="form-control" placeholder="Search tracking ID, Title, or File...">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button onclick="refreshData()" class="btn btn-primary w-100">
                        Refresh Data
                    </button>
                </div>
            </div>

            <hr>

            <div class="table-responsive">
                <table id="reportsTable" class="table table-striped table-hover w-100 border">
                    <thead class="table-dark">
                        <tr>
                            <th>Tracking ID</th>
                            <th>Title</th>
                            <th>Target Office</th>
                            <th>Current Status</th>
                            <th>Filename</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
